<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.container {
            border: 3px solid rgb(68, 63, 63);
            height: 250px;
            display: grid;

            grid-template: auto auto auto / auto auto auto;
            /*Shorthand de grid-template-rows, grid-template-columns*/
            place-items: normal normal;
            place-content: normal normal;
            /*
            shorthand de align items, align-content, justify  items e justify content. 
             
            primeiro vem o align e depois o justify*/
        }

        div.item {
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>

</html>
