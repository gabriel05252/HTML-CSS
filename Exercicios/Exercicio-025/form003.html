<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste formulario</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <form action="cadastro.php" method="get">
        <p><label for="isu">Usuario</label>
            <input type="text" name="usu" id="isu" placeholder="nome completo" autocomplete="name" required>
        </p>
        <p><label for="isen">Senha</label>
            <input type="password" name="sen" id="isen" placeholder="senha" required autocomplete="current-password">
        </p>
        <p> <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" placeholder="apenas numeros" step="0.1" max="10" min="0"
                required>
        </p>
        <label for="idata">Data</label>
        <input type="date" name="data" id="idata" required>
        
            <label for="ihora">Horario</label>
            <input type="time" name="hora" id="ihora" required>

            <p>
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" placeholder="digite seu email" autocomplete="email" required>
            </p>
    </form>
    <br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</body>

</html>
