<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset {
            border: 1px solid black;
            border-radius: 20px;
            width: 500px;
            margin: auto;
        }

        fieldset>p {
            display: flex;
            justify-content: center;

        }
    </style>
</head>

<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php">

        <fieldset>
            <legend>Dados Pessoais</legend>
            <p><label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" required minlength="3" placeholder="usuario">
            </p>
            <p><label for="imail">Email</label>
                <input type="email" name="email" id="imail" required placeholder="email">
            </p>
            <p><label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" required placeholder="(xx)xxxx-xxxx">
            </p>

            <input type="submit" value="Enviar">
            <input type="reset" value="Apagar">
        </fieldset>

    </form>
</body>

</html>
